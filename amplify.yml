version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm config set registry https://registry.npmjs.org/
        - npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund --progress=false
    build:
      commands:
        - npx --no-install ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
